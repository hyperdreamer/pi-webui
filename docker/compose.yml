name: pi-webui

x-pi-webui-build: &pi-webui-build
  context: .
  dockerfile: Dockerfile
  args:
    OPENSUSE_IMAGE: ${PI_WEBUI_OPENSUSE_IMAGE:-opensuse/tumbleweed}
    NODEJS_MAJOR: ${PI_WEBUI_NODEJS_MAJOR:-22}
    NODEJS_REPO: ${PI_WEBUI_NODEJS_REPO:-auto}
    PI_WEBUI_EXTRA_ZYPPER_PACKAGES: ${PI_WEBUI_EXTRA_ZYPPER_PACKAGES:-}
    PI_WEBUI_UID: ${PI_WEBUI_UID:-1000}
    PI_WEBUI_GID: ${PI_WEBUI_GID:-1000}
    PI_WEBUI_VERSION: ${PI_WEBUI_VERSION:-1.0.0}
    CACHE_BUST: ${CACHE_BUST:-local}

x-pi-webui-environment: &pi-webui-environment
  HOME: /data/home
  XDG_CONFIG_HOME: /data/config
  PI_WEBUI_DATA_DIR: /data/pi-webui
  PI_WEBUI_SESSIOND_SOCKET: /data/pi-webui/sessiond.sock
  PI_CODING_AGENT_DIR: /data/pi-agent
  HOSTEXEC_IMAGE: ${HOSTEXEC_IMAGE:-alpine:3.22}
  HOSTEXEC_MODE: ${HOSTEXEC_MODE:-disabled}
  PI_WEBUI_MAX_UPLOAD_BYTES: ${PI_WEBUI_MAX_UPLOAD_BYTES:-67108864}
  PI_WEBUI_DOCKER_RUNTIME: "1"
  PI_WEBUI_DOCKER_MODE: runtime
  PI_WEBUI_DOCKER_INSTALL_DIR: ${PI_WEBUI_DOCKER_INSTALL_DIR:?set by docker/install.sh}
  PI_WEBUI_DOCKER_HELPER_IMAGE: ${PI_WEBUI_IMAGE:-pi-webui:local}
  COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-pi-webui}

x-pi-webui-volumes: &pi-webui-volumes
  - type: bind
    source: ${PI_WEBUI_DOCKER_DATA_DIR:-./data}
    target: /data

services:
  sessiond:
    build: *pi-webui-build
    image: ${PI_WEBUI_IMAGE:-pi-webui:local}
    command: ["pi-webui-sessiond"]
    restart: unless-stopped
    user: "${PI_WEBUI_UID:-1000}:${PI_WEBUI_GID:-1000}"
    group_add:
      - "${DOCKER_GID:-0}"
    security_opt:
      - label=disable
    environment: *pi-webui-environment
    volumes: *pi-webui-volumes
    healthcheck:
      test: ["CMD-SHELL", "test -S /data/pi-webui/sessiond.sock"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s

  web:
    build: *pi-webui-build
    image: ${PI_WEBUI_IMAGE:-pi-webui:local}
    command: ["pi-webui-server"]
    restart: unless-stopped
    depends_on:
      sessiond:
        condition: service_healthy
    user: "${PI_WEBUI_UID:-1000}:${PI_WEBUI_GID:-1000}"
    group_add:
      - "${DOCKER_GID:-0}"
    security_opt:
      - label=disable
    environment:
      <<: *pi-webui-environment
      PI_WEBUI_HOST: 0.0.0.0
      PI_WEBUI_PORT: "8808"
    ports:
      - "${PI_WEBUI_BIND_ADDR:-127.0.0.1}:${PI_WEBUI_PORT:-8808}:8808"
    volumes: *pi-webui-volumes
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8808/api/pi-webui/runtime >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
